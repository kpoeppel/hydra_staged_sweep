[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hydra_staged_sweep"
version = "0.1.0"
description = "Sweeping and staging over hydra/omegaconf"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "hydra-core",
    "omegaconf",
    "compoconf>0.1.15",
    "networkx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=hydra_staged_sweep --cov-report=term-missing"
pythonpath = ["src"]